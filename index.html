<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kode Rahasia Handphone</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial;
}

body{
background:#f2f4f7;
transition:0.3s;
}

/* DARK MODE */

.dark{
background:#121212;
color:white;
}

/* HEADER */

.header{
background:#0d6efd;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:bold;
font-size:18px;
}

.dark-btn{
cursor:pointer;
}

/* SEARCH */

.search{
padding:15px;
max-width:700px;
margin:auto;
}

.search input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
outline:none;
box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

/* CONTAINER */

.container{
max-width:900px;
margin:auto;
padding:20px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

/* BRAND CARD */

.brand{
background:white;
padding:25px 10px;
border-radius:18px;
text-align:center;
cursor:pointer;
font-weight:600;
font-size:16px;
box-shadow:0 6px 18px rgba(0,0,0,0.15);
transition:0.2s;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:8px;

text-decoration:none;
color:black;
}

.brand:hover{
transform:scale(1.05);
background:#0d6efd;
color:white;
}

.brand:active{
transform:scale(0.95);
}

.icon{
font-size:28px;
}

.name{
font-size:16px;
}

/* DESKTOP MODE */

@media (min-width:900px){

.grid{
grid-template-columns:repeat(6,1fr);
}

}

/* FOOTER */

.footer{
text-align:center;
margin-top:30px;
font-size:13px;
color:#777;
}

</style>
</head>

<body>

<div class="header">
📱 Pusat Tools & Kode Rahasia Handphone
<div class="dark-btn" onclick="darkMode()">🌙</div>
</div>

<div class="search">
<input type="text" id="search" placeholder="Cari brand handphone...">
</div>

<div class="container">

<div class="grid">

<script>

/* DARK MODE */

function darkMode(){
document.body.classList.toggle("dark");
}

/* SEARCH */

const search = document.getElementById("search");

search.addEventListener("keyup",function(){

let filter = search.value.toLowerCase();
let brands = document.querySelectorAll(".brand");

brands.forEach(function(item){

let text = item.innerText.toLowerCase();

if(text.includes(filter)){
item.style.display="flex";
}else{
item.style.display="none";
}

});

});

</script>
