<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panic Full Analyzer PRO</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: #e2e8f0;
    padding: 15px;
}

h1 {
    text-align: center;
    color: #38bdf8;
}

textarea, button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border-radius: 8px;
    border: none;
}

button {
    background: #22c55e;
    color: white;
    font-weight: bold;
}

.card {
    background: #1e293b;
    padding: 12px;
    border-radius: 10px;
    margin-top: 10px;
}

.type {
    color: #facc15;
    font-weight: bold;
}

.detail {
    color: #22c55e;
    margin-top: 5px;
}

.delete {
    background: red;
    margin-top: 5px;
}
</style>
</head>
<body>

<h1>Panic Full Analyzer PRO</h1>

<textarea id="logInput" placeholder="Paste panicString di sini..."></textarea>
<button onclick="tambah()">Analisa</button>

<div id="hasil"></div>

<script>
function analisa(text) {
    text = text.toLowerCase();

    // SENSOR DETAIL
    if(text.includes("mic1")) return ["Mic Atas", "Flex audio / mic1 rusak"];
    if(text.includes("mic2")) return ["Mic Bawah", "Dock / charging flex"];
    if(text.includes("prox")) return ["Proximity", "Flex sensor atas"];
    if(text.includes("als")) return ["Ambient Light", "Sensor cahaya"];
    if(text.includes("barometer")) return ["Barometer", "IC barometer"];
    if(text.includes("gyro")) return ["Gyroscope", "IC gyro"];
    if(text.includes("accel")) return ["Accelerometer", "IC sensor gerak"];

    // FACE ID
    if(text.includes("face")) return ["Face ID", "Flex kamera depan / dot projector"];

    // BASEBAND
    if(text.includes("baseband")) return ["Signal", "IC baseband / jalur RF"];

    // NAND / STORAGE
    if(text.includes("nand")) return ["Memory", "IC NAND rusak"];
    if(text.includes("apfs")) return ["Storage System", "File system error / NAND"];

    // POWER
    if(text.includes("pmu") || text.includes("power")) return ["Power", "IC power / short"];
    if(text.includes("vdd")) return ["Tegangan", "Drop tegangan jalur"];

    // WATCHDOG
    if(text.includes("watchdog")) return ["Watchdog", "IC tidak respon"];

    // I2C
    if(text.includes("i2c")) return ["Jalur I2C", "Komunikasi antar IC putus"];

    // THERMAL
    if(text.includes("thermal")) return ["Suhu", "Sensor suhu / overheating"];

    // CPU / KERNEL
    if(text.includes("cpu")) return ["CPU", "Kemungkinan CPU / jalur utama"];

    return ["Tidak diketahui", "Perlu analisa manual"];
}

function tambah() {
    let input = document.getElementById("logInput").value;
    if(input === "") return;

    let hasil = analisa(input);

    document.getElementById("hasil").innerHTML = `
        <div class="card">
            <div class="type">${hasil[0]}</div>
            <div>${input}</div>
            <div class="detail">${hasil[1]}</div>
        </div>
    `;
}
</script>

</body>
</html>
